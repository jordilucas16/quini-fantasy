[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quini-fantasy"
version = "0.1.0"
description = "A Python application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "pydantic>=2.10.0",
    "pydantic[email]>=2.10.0",
    "python-multipart>=0.0.20",
]

[project.scripts]
quini-fantasy = "quini_fantasy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quini_fantasy"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # function-call-in-default-argument (needed for FastAPI Depends)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["bcrypt", "jwt"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]
