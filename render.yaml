services:
  # Web service for Quini Fantasy
  - type: web
    name: quini-fantasy
    runtime: docker
    plan: free
    region: frankfurt  # or oregon for US
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"

# Notes:
# - Free tier: No persistent disk (database resets on each deploy)
# - Database is initialized from CSV on startup
# - JWT_SECRET_KEY is auto-generated for security
# - Health check at /health
# - Free tier: 750 hours/month
# - To deploy: Connect your GitHub repo to Render
